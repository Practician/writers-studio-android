apply plugin: 'com.android.application'

android {
    namespace = "com.practician.writersstudio"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.practician.writersstudio"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // В CI это номер запуска GitHub Actions: каждая опубликованная сборка может обновить предыдущую.
        def appVersionCode = System.getenv("APP_VERSION_CODE")?.trim()
        versionCode (appVersionCode ? appVersionCode.toInteger() : 3)
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    def bundledKeystore = file("${project.rootDir}/keystore/release-key.jks")
    def releaseStoreFilePath = System.getenv("RELEASE_STORE_FILE") ?: (bundledKeystore.exists() ? bundledKeystore.absolutePath : null)
    def releaseStorePassword = System.getenv("RELEASE_STORE_PASSWORD") ?: (bundledKeystore.exists() ? "BookStore-Release-2026-Secure" : null)
    def releaseKeyAlias = System.getenv("RELEASE_KEY_ALIAS") ?: (bundledKeystore.exists() ? "bookstore-key" : null)
    // Для постоянной подписи пароль ключа совпадает с паролем keystore.
    def releaseKeyPassword = System.getenv("RELEASE_KEY_PASSWORD") ?: releaseStorePassword
    def releaseSigningReady = releaseStoreFilePath && file(releaseStoreFilePath).exists() && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    def requestedTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
    def releaseTaskRequested = requestedTasks.any { it.contains("release") }
    if (releaseTaskRequested && !releaseSigningReady) {
        throw new GradleException("Release signing requires a valid keystore in android/keystore/release-key.jks or RELEASE_STORE_FILE/RELEASE_STORE_PASSWORD/RELEASE_KEY_ALIAS environment variables.")
    }

    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
