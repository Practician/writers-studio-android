name: Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Проверка и debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Настроить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Установить зависимости
        run: npm ci

      - name: Проверить TypeScript
        run: npm run lint

      - name: Запустить тесты
        run: npm test

      - name: Собрать web bundle внутри APK
        run: npm run build

      - name: Синхронизировать Capacitor Android
        run: npx cap sync android

      - name: Собрать debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Подготовить APK для скачивания
        id: apk
        run: |
          VERSION_NAME=$(grep -E '^[[:space:]]*versionName ' android/app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          APK_NAME="WritersStudio-Android-v${VERSION_NAME}-build-${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Сохранить APK как workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: writers-studio-android-debug-${{ github.sha }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 14

      - name: Опубликовать APK в GitHub Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.apk.outputs.version }}-build-${{ github.run_number }}
          RELEASE_TITLE: Writers Studio Android v${{ steps.apk.outputs.version }} · тестовая сборка ${{ github.run_number }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "Установочный APK для коммита $GITHUB_SHA. Внутри — автономный Writers Studio; ключ ИИ добавляется после установки. Это debug-сборка для тестирования, не файл для Google Play." \
            --latest

# Подписанный release APK/AAB для Google Play создаётся отдельным signing workflow.
# Signing keystore и пароли хранятся только как GitHub Secrets; LLM API-ключи
# в GitHub Secrets и APK не добавляются, их вводит пользователь после установки.
