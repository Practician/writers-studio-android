<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    
    <!-- Gold / Cosmic Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Book Pages Gradient -->
    <linearGradient id="page-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  
  <!-- Outer Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#gold-grad)" stroke-width="4" opacity="0.3" />

  <!-- Open Book Symbol -->
  <g transform="translate(0, 30)">
    <!-- Back / Cover -->
    <path d="M 120,320 C 180,310 240,330 256,340 C 272,330 332,310 392,320 L 400,150 C 340,140 280,160 256,170 C 232,160 172,140 112,150 Z" fill="#1e293b" stroke="url(#gold-grad)" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Left Page -->
    <path d="M 128,310 C 180,300 235,318 250,325 L 250,158 C 235,151 180,133 128,143 Z" fill="url(#page-grad)" />
    
    <!-- Right Page -->
    <path d="M 384,310 C 332,300 277,318 262,325 L 262,158 C 277,151 332,133 384,143 Z" fill="url(#page-grad)" />

    <!-- Book Lines (Simulated text) -->
    <path d="M 150,180 H 225 M 150,210 H 215 M 150,240 H 230 M 150,270 H 200" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <path d="M 287,180 H 362 M 297,210 H 362 M 287,240 H 347 M 297,270 H 352" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Feather Quill Pen (glowing) -->
  <g transform="translate(10, 0)" filter="url(#glow)">
    <!-- Feather Main Body -->
    <path d="M 330,80 C 270,110 240,160 220,230 C 215,250 216,275 220,285 C 223,290 222,295 210,310 L 195,330 C 192,334 195,340 200,340 L 215,335 C 230,320 234,319 239,322 C 250,328 275,324 295,315 C 360,285 390,210 410,130 C 420,90 390,60 330,80 Z" fill="url(#gold-grad)" opacity="0.9" />
    
    <!-- Quill Shaft / Stem -->
    <path d="M 370,110 C 310,160 250,240 195,335" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    
    <!-- Magic sparkles around the quill -->
    <circle cx="170" cy="310" r="8" fill="#10b981" />
    <circle cx="410" cy="190" r="6" fill="#8b5cf6" />
    <circle cx="280" cy="120" r="10" fill="#ec4899" />
    <circle cx="360" cy="270" r="5" fill="#ffffff" />
  </g>
</svg>
